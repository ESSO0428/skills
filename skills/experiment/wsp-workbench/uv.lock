]
dev = [
    { name = "pytest" },
]
safetensors = [
    { name = "safetensors" },
]

[package.metadata]
requires-dist = [
    { name = "numpy" },
    { name = "pytest", marker = "extra == 'dev'" },
    { name = "safetensors", marker = "extra == 'safetensors'" },
    { name = "torch", marker = "extra == 'cpu'", index = "https://download.pytorch.org/whl/cpu", conflict = { package = "wsp-workbench", extra = "cpu" } },
    { name = "torch", marker = "extra == 'cu126'", index = "https://download.pytorch.org/whl/cu126", conflict = { package = "wsp-workbench", extra = "cu126" } },
    { name = "torch", marker = "extra == 'cu132'", index = "https://download.pytorch.org/whl/cu132", conflict = { package = "wsp-workbench", extra = "cu132" } },
]
provides-extras = ["cpu", "cu126", "cu132", "safetensors", "dev"]
