[project]
name = "wsp-workbench"
version = "0.1.0"
description = "Weight-space programming workbench: gated, ledgered, non-optimising weight edits for PyTorch models."
requires-python = ">=3.11"
dependencies = ["torch"]

[project.optional-dependencies]
safetensors = ["safetensors"]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
