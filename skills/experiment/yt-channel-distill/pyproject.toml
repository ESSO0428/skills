[project]
name = "yt-channel-distill"
version = "0.1.0"
description = "Experimental provenance-preserving YouTube channel distillation pipeline"
requires-python = ">=3.11"
dependencies = ["yt-dlp"]

[project.optional-dependencies]
asr = ["faster-whisper"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channel_distill"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
